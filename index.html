<style>
:root{
  --orange:#f58220; --teal:#41b6d6;
  --bg:#ffffff; --surface:#f3f5f6; --line:#e1e5e7;
  --text:#2b2f31; --muted:#6b7478; --on-accent:#ffffff;
  --accent:#e8710a; --shadow:0 -1px 0 var(--line); --err:#d93025; --ok:#188038; --own:#d9f2f8;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#1c2022; --surface:#272c2f; --line:#363c40;
  --text:#f1f3f4; --muted:#9aa3a8; --accent:#f58220; --err:#ff8a80; --ok:#6fcf97; --own:#1f4a58;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
button,input{font:inherit;color:inherit}
.screen{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.screen.active{display:flex}

/* Splash */
#splash{align-items:center;justify-content:center;gap:18px;transition:opacity .45s ease}
#splash.hide{opacity:0}
#splash img{width:132px;height:132px;animation:pop .9s cubic-bezier(.2,.8,.2,1) both}
.wordmark{font-weight:800;font-size:36px;letter-spacing:.03em}
#splash .sub{font-family:Satisfy,"Snell Roundhand",cursive;font-size:34px;line-height:1;color:var(--orange);margin-top:-14px}
@keyframes pop{from{opacity:0;transform:scale(.82) rotate(-25deg)}to{opacity:1;transform:none}}

/* Auth */
#auth{overflow-y:auto;align-items:center}
.auth-wrap{width:100%;max-width:400px;padding:36px 24px 28px;margin:auto}
.auth-head{text-align:center;margin-bottom:28px}
.auth-head img{width:84px;height:84px}
.auth-head h1{font-size:24px;font-weight:600;margin-top:10px}
.auth-head p{color:var(--muted);font-size:14px;margin-top:4px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
.field input{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);outline:none}
.field input:focus-visible{border-color:var(--teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 30%,transparent)}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--orange);color:#fff;font-weight:600;font-size:15px;cursor:pointer;margin-top:6px}
.btn:active{transform:scale(.985)}
.btn:focus-visible,.tab:focus-visible,.link:focus-visible,.icon-btn:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.link{background:none;border:0;color:var(--teal);font-weight:600;cursor:pointer;padding:4px}
.switch{text-align:center;font-size:14px;color:var(--muted);margin-top:18px}
.forgot{display:block;margin:2px 0 0 auto;font-size:13px}
.hidden{display:none!important}

/* App shell */
#app{overflow:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.topbar h2{font-size:22px;font-weight:600}
.icon-btn{background:none;border:0;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.icon-btn svg{width:22px;height:22px}
main{flex:1;overflow-y:auto}
.view{display:none}
.view.active{display:block}
.row{display:flex;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--orange));display:grid;place-items:center;color:#fff;font-weight:600;flex:none}
.row b{display:block;font-size:15px}
.row span{font-size:13px;color:var(--muted)}
.empty{padding:56px 32px;text-align:center;color:var(--muted);font-size:14px;line-height:1.6}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:6px}
.setting{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);font-size:15px}
.toggle{width:50px;height:30px;border-radius:15px;border:0;background:var(--line);position:relative;cursor:pointer;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle[aria-checked="true"]{background:var(--teal)}
.toggle[aria-checked="true"]::after{transform:translateX(20px)}
.logout{margin:22px 18px;width:calc(100% - 36px);background:var(--surface);color:var(--text);border:1px solid var(--line)}
nav{display:flex;border-top:1px solid var(--line);background:var(--bg)}
.tab{flex:1;background:none;border:0;padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:500;color:var(--muted);cursor:pointer}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--accent)}
.msg{font-size:13px;line-height:1.45;min-height:18px;margin:8px 0 2px;color:var(--err)}
.msg.ok{color:var(--ok)}
.btn[disabled]{opacity:.6;cursor:default}
.edit{padding:16px 18px;border-bottom:1px solid var(--line)}
.grow{flex:1;min-width:0}
.grow span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tap{cursor:pointer}
.badge{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--orange);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;flex:none}
.chathead{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 6px;border-bottom:1px solid var(--line)}
.chathead .avatar{width:40px;height:40px;font-size:14px}
.ct{min-width:0}.ct b{display:block;font-size:16px}.ct span{font-size:12px;color:var(--muted)}
#msgs,#dmMsgs{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:3px;background:var(--surface)}
.daysep{align-self:center;font-size:12px;color:var(--muted);background:var(--bg);padding:4px 12px;border-radius:12px;margin:10px 0 6px}
.mrow{display:flex;gap:6px;align-items:flex-end}
.mrow.mine{justify-content:flex-end}
.avatar.xs{width:28px;height:28px;font-size:11px}
.avatar.ghost{visibility:hidden}
.bubble{max-width:78%;padding:7px 10px 5px;border-radius:14px;background:var(--bg);border:1px solid var(--line);font-size:15px;line-height:1.4;overflow-wrap:anywhere;cursor:pointer}
.mine .bubble{background:var(--own);border-color:transparent}
.who{font-size:12.5px;font-weight:700;color:var(--teal);margin-bottom:2px}
.txt{white-space:pre-wrap}
.gone .txt{font-style:italic;color:var(--muted)}
.gone{cursor:default}
.meta{font-size:11px;color:var(--muted);margin-top:2px;display:flex;gap:6px;justify-content:flex-end}
.seen{color:var(--teal);font-weight:600}
.quote{border-left:3px solid var(--orange);padding:3px 8px;margin-bottom:5px;border-radius:4px;background:color-mix(in srgb,var(--text) 7%,transparent);font-size:13px}
.quote b{display:block;font-size:12px}
.quote span{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flash .bubble{animation:flash 1s}
@keyframes flash{50%{box-shadow:0 0 0 3px var(--teal)}}
#replyBar{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;border-top:1px solid var(--line);background:var(--bg);border-left:3px solid var(--orange);font-size:13px}
#replyBar div{flex:1;min-width:0}
#replyBar b{display:block;font-size:12px}
#replyBar span{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#composer,#dmForm{display:flex;gap:8px;align-items:flex-end;padding:8px 10px;border-top:1px solid var(--line);background:var(--bg)}
#mi,#dmInput{flex:1;resize:none;max-height:120px;padding:11px 14px;border-radius:20px;border:1.5px solid var(--line);background:var(--surface);outline:none;line-height:1.35}
#mi:focus-visible,#dmInput:focus-visible{border-color:var(--teal)}
.send{width:44px;height:44px;border:0;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.send svg{width:21px;height:21px}
.sheet{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:5}
.sheet-card{width:100%;background:var(--bg);border-radius:18px 18px 0 0;padding:8px 12px calc(12px + env(safe-area-inset-bottom,0px))}
.sheet-btn{width:100%;padding:15px 8px;border:0;background:none;font-size:16px;text-align:left;cursor:pointer;border-bottom:1px solid var(--line);color:var(--text)}
.sheet-btn:last-child{border-bottom:0}
.sheet-btn.danger{color:var(--err)}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#2b2f31;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:20;max-width:86%;text-align:center}
@media (prefers-reduced-motion:reduce){#splash img{animation:none}*{transition:none!important}}
/* Phase 4: people */
.search{padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:1}
.search input{width:100%;padding:11px 14px;border-radius:20px;border:1.5px solid var(--line);background:var(--surface);outline:none}
.search input:focus-visible{border-color:var(--teal)}
.avwrap{position:relative;flex:none}
.avatar{overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.dot{position:absolute;right:0;bottom:0;width:13px;height:13px;border-radius:50%;background:var(--ok);border:2px solid var(--bg)}
.avatar.lg{width:96px;height:96px;font-size:34px}
.row span.on{color:var(--ok);font-weight:600}
#person{overflow-y:auto}
.phead{display:flex;align-items:center;gap:6px;padding:8px 12px 8px 6px;border-bottom:1px solid var(--line)}
.phead b{font-size:16px}
.pbody{display:flex;flex-direction:column;align-items:center;padding:28px 18px 22px;gap:4px;text-align:center}
.pbody h3{font-size:22px;font-weight:600;margin-top:12px;overflow-wrap:anywhere}
.pstat{font-size:14px;color:var(--muted)}
.pstat.on{color:var(--ok);font-weight:600}
.tab{position:relative}.tab.has::before{content:"";position:absolute;top:8px;left:calc(50% + 9px);width:10px;height:10px;border-radius:50%;background:var(--orange);border:2px solid var(--bg)}
/* Phase 7: media */
.media{margin:2px 0 4px}
.media img,.media video{display:block;max-width:100%;max-height:320px;border-radius:10px;background:#000}
.media img{cursor:zoom-in}
.doc{display:flex;flex-direction:column;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--text) 8%,transparent);color:inherit;text-decoration:none;font-size:14px}
.doc b{overflow-wrap:anywhere}.doc span{font-size:12px;color:var(--muted)}
.attbar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line);background:var(--bg)}
.attbar.busy{opacity:.65}
.attbar .th{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--surface);flex:none}
div.th{display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted)}
.attbar .nm{flex:1;min-width:0;font-size:13px}
.attbar .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attbar .nm span{color:var(--muted)}
#viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:30;display:flex;align-items:center;justify-content:center}
#viewer img{max-width:100%;max-height:100%;object-fit:contain}
#viewer .icon-btn{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:8px;color:#fff}
</style>
</head>

<section id="app" class="screen">

async function shrink(file, maxDim, q) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return file;
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
    const k = Math.min(1, maxDim / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    const g = c.getContext("2d");
    g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
    g.drawImage(bmp, 0, 0, c.width, c.height);
    if (bmp.close) bmp.close();
    const blob = await new Promise((res) => c.toBlob(res, "image/jpeg", q));
    if (!blob || blob.size >= file.size) return file;
    return new File([blob], file.name.replace(/\.\w+$/, "") + ".jpg", { type: "image/jpeg" });
  } catch (e) { return file; }
}

function cloudUpload(file, folder, onProgress) {
  return new Promise((resolve, reject) => {
    const fd = new FormData();
    fd.append("file", file); fd.append("upload_preset", UPLOAD_PRESET); fd.append("folder", folder);
    const x = new XMLHttpRequest();
    x.open("POST", "https://api.cloudinary.com/v1_1/" + CLOUD_NAME + "/auto/upload");
    if (onProgress && x.upload) x.upload.onprogress = (e) => { if (e.lengthComputable) onProgress(Math.round(e.loaded / e.total * 100)); };
    x.onload = () => {
      if (x.status >= 200 && x.status < 300) { try { resolve(JSON.parse(x.responseText)); } catch (e) { reject(e); } }
      else reject(new Error("upload failed"));
    };
    x.onerror = () => reject(new Error("network"));
    x.send(fd);
  });
}

function mediaEl(md) {
  const w = h("div", "media");
  w.addEventListener("click", (e) => e.stopPropagation());
  if (!md || typeof md.url !== "string" || !/^https:\/\/res\.cloudinary\.com\//.test(md.url)) { w.appendChild(h("div", "txt", "Unsupported attachment")); return w; }
  if (md.type === "image") {
    const i = document.createElement("img");
    i.src = cld(md.url, "w_640,c_limit,f_auto,q_auto"); i.alt = md.name || "Photo"; i.loading = "lazy";
    i.addEventListener("click", () => openViewer(md.url));
    w.appendChild(i);
  } else if (md.type === "video") {
    const v = document.createElement("video");
    v.src = md.url; v.controls = true; v.preload = "metadata"; v.playsInline = true;
    w.appendChild(v);
  } else {
    const a = document.createElement("a");
    a.href = md.url; a.target = "_blank"; a.rel = "noopener"; a.className = "doc";
    a.appendChild(h("b", null, md.name || "Document"));
    a.appendChild(h("span", null, sizeStr(md.size || 0) + " \u00B7 Tap to open"));
    w.appendChild(a);
  }
  return w;
}

function openViewer(url) { $("#viewerImg").src = cld(url, "w_1600,c_limit,f_auto,q_auto"); $("#viewer").classList.remove("hidden"); }
function closeViewer() { $("#viewer").classList.add("hidden"); $("#viewerImg").removeAttribute("src"); }

function renderBar(ctx) {
  const bar = $(ctx === "main" ? "#attBar" : "#dmAttBar"), a = pend[ctx];
  if (!a) { bar.classList.add("hidden"); bar.replaceChildren(); return; }
  bar.classList.remove("hidden"); bar.classList.toggle("busy", !!a.busy);
  let th;
  if (a.kind === "image") { th = document.createElement("img"); th.src = a.preview; th.alt = ""; }
  else if (a.kind === "video") { th = document.createElement("video"); th.src = a.preview; th.muted = true; th.preload = "metadata"; }
  else { th = document.createElement("div"); th.textContent = (a.file.name.split(".").pop() || "file").slice(0, 4).toUpperCase(); }
  th.className = "th";
  const nm = h("div", "nm");
  nm.appendChild(h("b", null, a.file.name));
  nm.appendChild(h("span", null, a.busy ? (a.status || "Uploading...") : sizeStr(a.file.size)));
  const x = h("button", "icon-btn");
  x.type = "button"; x.innerHTML = XSVG; x.disabled = !!a.busy; x.setAttribute("aria-label", "Remove attachment");
  x.addEventListener("click", () => clearPending(ctx));
  bar.replaceChildren(th, nm, x);
}

function clearPending(ctx) {
  const a = pend[ctx];
  if (a && a.preview) URL.revokeObjectURL(a.preview);
  pend[ctx] = null; renderBar(ctx);
}

function pickFile(ctx, file) {
  if (!file) return;
  const kind = file.type.startsWith("image/") ? "image" : file.type.startsWith("video/") ? "video" : "file";
  const max = kind === "video" ? 25 : kind === "image" ? 20 : 10;
  if (file.size > max * 1048576) { toast("That file is too big. The limit is " + max + " MB."); return; }
  clearPending(ctx);
  pend[ctx] = { file: file, kind: kind, preview: kind === "file" ? "" : URL.createObjectURL(file), busy: false };
  renderBar(ctx);
}

async function uploadPending(ctx) {
  const a = pend[ctx];
  if (!CLOUD_NAME || !UPLOAD_PRESET) { toast("Media uploads aren't set up yet."); return null; }
  a.busy = true; a.status = a.kind === "image" ? "Optimizing..." : "Uploading..."; renderBar(ctx);
  try {
    const f = a.kind === "image" ? await shrink(a.file, 1600, 0.82) : a.file;
    a.status = "Uploading..."; renderBar(ctx);
    const r = await cloudUpload(f, "chat", (pct) => {
      const sp = $((ctx === "main" ? "#attBar" : "#dmAttBar") + " .nm span");
      if (sp) sp.textContent = "Uploading " + pct + "%";
    });
    a.busy = false; a.status = ""; renderBar(ctx);
    return { url: r.secure_url, type: a.kind, name: a.file.name.slice(0, 120), size: f.size };
  } catch (err) {
    a.busy = false; a.status = ""; renderBar(ctx);
    toast("Upload failed. Check your connection and try again.");
    return null;
  }
}

async function setPhoto(file) {
  const m = $("#photoMsg"), b = $("#photoBtn");
  if (!file) return;
  if (!file.type.startsWith("image/")) { msg(m, "Choose an image."); return; }
  if (file.size > 10 * 1048576) { msg(m, "Image must be under 10 MB."); return; }
  if (!CLOUD_NAME || !UPLOAD_PRESET) { msg(m, "Photo uploads aren't set up yet."); return; }
  msg(m, "Uploading..."); busy(b, true);
  try {
    const r = await cloudUpload(await shrink(file, 512, 0.85), "avatars");
    const url = cld(r.secure_url, "c_fill,g_auto,w_256,h_256,f_auto,q_auto");
    await updateDoc(doc(db, "publicProfiles", user.uid), { photoURL: url });
    profile = Object.assign({}, profile, { photoURL: url });
    fillProfile(); msg(m, "Photo updated.", true);
  } catch (err) { msg(m, "Couldn't update your photo. Try again."); }
  finally { busy(b, false); }
}

function ping() {
  if (document.hidden || !user) return;
  updateDoc(doc(db, "publicProfiles", user.uid), { lastSeen: serverTimestamp() }).catch(() => {});
}

function startRealtime() {
  if (unsubs.length) return;
  const q = query(collection(db, "chats", MAIN, "messages"), orderBy("createdAt", "desc"), limit(100));
  unsubs.push(onSnapshot(q, (snap) => {
    msgs = snap.docs.map((d) => Object.assign({ id: d.id, pending: d.metadata.hasPendingWrites }, d.data({ serverTimestamps: "estimate" }))).reverse();
    renderList();
    if (chatOpen) { renderMsgs(false); markRead(); }
  }, () => {
    $("#lastMsg").textContent = "Can't load the chat. Publish the new Firestore rules.";
    $("#chatSub").textContent = "Can't load messages";
  }));
  unsubs.push(onSnapshot(collection(db, "chats", MAIN, "reads"), (snap) => {
    reads = {};
    snap.forEach((d) => { const a = d.data({ serverTimestamps: "estimate" }).at; if (a) reads[d.id] = tms(a); });
    readsReady = true;
    renderList();
    if (chatOpen) renderMsgs(false);
  }, () => {}));
  unsubs.push(onSnapshot(collection(db, "publicProfiles"), (snap) => {
    people = {};
    snap.forEach((d) => { const x = d.data({ serverTimestamps: "estimate" }); people[d.id] = { name: x.name || "Student", last: tms(x.lastSeen), photo: x.photoURL || "" }; });
    updateSub(); renderPeople(); if (viewingId) renderPerson(); renderDmList(); if (dmOpenId) dmHead();
  }, () => {}));
  unsubs.push(onSnapshot(query(collection(db, "dms"), where("members", "array-contains", user.uid)), (snap) => {
    snap.docChanges().forEach((c) => {
      if (!dmReady || c.type === "removed" || c.doc.metadata.hasPendingWrites || c.doc.id === dmOpenId) return;
      const d = c.doc.data({ serverTimestamps: "estimate" }), prev = dmConvs[c.doc.id];
      if (d.lastUid && d.lastUid !== user.uid && (!prev || tms(d.lastAt) > tms(prev.lastAt))) {
        const p = people[peerOf(d)];
        toast((p ? p.name : "New message") + ": " + d.lastText);
      }
    });
    dmConvs = {};
    snap.forEach((c) => { dmConvs[c.id] = c.data({ serverTimestamps: "estimate" }); });
    dmReady = true; renderDmList();
    if (dmOpenId) { renderDm(); markDmRead(); }
  }, () => {}));
  ping();
  pingTimer = setInterval(ping, 60000);
  tickTimer = setInterval(() => { updateSub(); renderPeople(); if (viewingId) renderPerson(); renderDmList(); if (dmOpenId) dmHead(); }, 30000);
}

function stopRealtime() {
  unsubs.forEach((f) => f());
  unsubs = []; msgs = []; reads = {}; readsReady = false; people = {};
  clearInterval(pingTimer); clearInterval(tickTimer);
  viewingId = null; peopleQ = ""; $("#peopleSearch").value = ""; $("#peopleList").replaceChildren();
  if (dmUnsub) dmUnsub();
  dmUnsub = null; dmOpenId = null; dmPeer = null; dmMsgs = []; dmConvs = {}; dmReady = false; chatQ = "";
  $("#chatSearch").value = ""; $("#dmList").replaceChildren(); $("#dm").style.height = "";
  $('.tab[data-view="chats"]').classList.remove("has");
  clearPending("main"); clearPending("dm");
  chatOpen = false; clearReply(); closeSheet();
  $("#chat").style.height = "";
}

function renderList() {
  if (!user) return;
  const last = msgs[msgs.length - 1], el = $("#lastMsg");
  if (!last) { el.textContent = "No messages yet. Say hello."; }
  else {
    const who = last.uid === user.uid ? "You" : (last.name || "").split(" ")[0];
    el.textContent = who + ": " + (last.deleted ? "Message deleted" : last.text);
  }
  const mine = reads[user.uid] || 0;
  const n = (chatOpen || !readsReady) ? 0 : msgs.filter((m) => m.uid !== user.uid && !m.deleted && tms(m.createdAt) > mine).length;
  const b = $("#unread");
  b.textContent = n > 99 ? "99+" : String(n);
  b.classList.toggle("hidden", n === 0);
  updateDot();
}

function updateSub() {
  if (!chatOpen) return;
  const ids = Object.keys(people), now = Date.now();
  if (!ids.length) { $("#chatSub").textContent = "Loading..."; return; }
  const on = ids.filter((id) => now - people[id].last < 120000).length;
  $("#chatSub").textContent = ids.length + " members, " + on + " online";
}

function renderMsgs(forceBottom) {
  const el = $("#msgs");
  const near = el.scrollHeight - el.scrollTop - el.clientHeight < 140, top = el.scrollTop;
  const frag = document.createDocumentFragment();
  let prev = null, prevDay = "";
  for (const m of msgs) {
    const t = tms(m.createdAt) || Date.now(), day = dayLabel(t);
    if (day !== prevDay) { frag.appendChild(h("div", "daysep", day)); prevDay = day; prev = null; }
    const mine = m.uid === user.uid, sameRun = !!prev && prev.uid === m.uid;
    const row = h("div", "mrow" + (mine ? " mine" : ""));
    row.dataset.id = m.id;
    if (!mine) row.appendChild(avatarEl(m.name || "?", (people[m.uid] || {}).photo, "xs" + (sameRun ? " ghost" : ""), false));
    const b = h("div", "bubble" + (m.deleted ? " gone" : ""));
    if (!mine && !sameRun) b.appendChild(h("div", "who", m.name));
    if (m.replyTo && !m.deleted) {
      const q = h("div", "quote");
      q.dataset.ref = m.replyTo.id;
      q.appendChild(h("b", null, m.replyTo.name));
      q.appendChild(h("span", null, m.replyTo.text));
      b.appendChild(q);
    }
    if (m.media && !m.deleted) b.appendChild(mediaEl(m.media));
    { const t = m.deleted ? "This message was deleted" : capOf(m); if (t) b.appendChild(h("div", "txt", t)); }
    const meta = h("div", "meta");
    meta.appendChild(h("span", null, timeStr(t)));
    if (mine && !m.deleted) {
      let seen = 0;
      for (const id in reads) { if (id !== user.uid && reads[id] >= t) seen++; }
      if (m.pending) meta.appendChild(h("span", null, "..."));
      else if (seen > 0) meta.appendChild(h("span", "seen", "\u2713\u2713 " + seen));
      else meta.appendChild(h("span", null, "\u2713"));
    }
    b.appendChild(meta);
    row.appendChild(b);
    frag.appendChild(row);
    prev = m;
  }
  el.replaceChildren(frag);
  const lastMine = msgs.length && msgs[msgs.length - 1].uid === user.uid;
  el.scrollTop = (forceBottom || near || lastMine) ? el.scrollHeight : top;
}

function markRead() {
  if (!chatOpen || document.hidden || !user || !msgs.length) return;
  const last = tms(msgs[msgs.length - 1].createdAt);
  if (last <= (reads[user.uid] || 0)) return;
  setDoc(doc(db, "chats", MAIN, "reads", user.uid), { at: serverTimestamp() }).catch(() => {});
}

function openChat() {
  chatOpen = true;
  window.Cohort.show("chat");
  renderMsgs(true); renderList(); updateSub(); markRead();
}
function closeChat() {
  chatOpen = false; clearReply(); closeSheet();
  $("#chat").style.height = "";
  window.Cohort.show("app");
  renderList();
}

function autosize() { const t = $("#mi"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 120) + "px"; }
function clearReply() { replyRef = null; $("#replyBar").classList.add("hidden"); }

async function send() {
  const box = $("#mi"), text = box.value.trim(), att = pend.main;
  if (!text && !att) return;
  if (att && att.busy) return;
  let media = null;
  if (att) { media = await uploadPending("main"); if (!media) return; }
  const payload = { text: text || mediaLabel(media), uid: user.uid, name: myName(), createdAt: serverTimestamp(), replyTo: replyRef ? { id: replyRef.id, name: replyRef.name, text: replyRef.text } : null, deleted: false };
  if (media) payload.media = media;
  box.value = ""; autosize(); clearReply();
  try { await addDoc(collection(db, "chats", MAIN, "messages"), payload); clearPending("main"); }
  catch (err) { box.value = text; autosize(); toast("Message not sent. Check your connection and try again."); }
}

function openSheet(m) { picked = m; $("#actDelete").classList.toggle("hidden", m.uid !== user.uid); $("#sheet").classList.remove("hidden"); }
function closeSheet() { picked = null; $("#sheet").classList.add("hidden"); }
function jumpTo(id) {
  const row = $("#msgs").querySelector('[data-id="' + CSS.escape(id) + '"]');
  if (!row) { toast("That message is too old to show."); return; }
  row.scrollIntoView({ block: "center" });
  row.classList.add("flash");
  setTimeout(() => row.classList.remove("flash"), 1000);
}

$("#openMain").addEventListener("click", openChat);
$("#openMain").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openChat(); } });
$("#chatBack").addEventListener("click", closeChat);
$("#composer").addEventListener("submit", (e) => { e.preventDefault(); send(); });
$("#mi").addEventListener("input", autosize);
$("#mi").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !/Android|iPhone|iPad|Mobi/i.test(navigator.userAgent)) { e.preventDefault(); send(); }
});
$("#msgs").addEventListener("click", (e) => {
  const q = e.target.closest(".quote");
  if (q) { jumpTo(q.dataset.ref); return; }
  const b = e.target.closest(".bubble");
  if (!b) return;
  const m = msgs.find((x) => x.id === b.parentElement.dataset.id);
  if (m && !m.deleted) openSheet(m);
});
$("#actCancel").addEventListener("click", closeSheet);
$("#sheet").addEventListener("click", (e) => { if (e.target.id === "sheet") closeSheet(); });
$("#actReply").addEventListener("click", () => {
  if (!picked) return;
  replyRef = { id: picked.id, name: picked.name, text: picked.text.slice(0, 120) };
  $("#rbName").textContent = replyRef.name;
  $("#rbText").textContent = replyRef.text;
  $("#replyBar").classList.remove("hidden");
  closeSheet(); $("#mi").focus();
});
$("#actDelete").addEventListener("click", async () => {
  const m = picked; closeSheet();
  if (!m || !confirm("Delete this message for everyone?")) return;
  try { await updateDoc(doc(db, "chats", MAIN, "messages", m.id), { deleted: true, text: "" }); }
  catch (err) { toast("Couldn't delete the message. Try again."); }
});
$("#rbClose").addEventListener("click", clearReply);
$("#peopleSearch").addEventListener("input", (e) => { peopleQ = e.target.value; renderPeople(); });
$("#peopleList").addEventListener("click", (e) => { const r = e.target.closest(".row"); if (r) openPerson(r.dataset.id); });
$("#peopleList").addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const r = e.target.closest(".row");
  if (r) { e.preventDefault(); openPerson(r.dataset.id); }
});
$("#personBack").addEventListener("click", closePerson);
$("#uMsg").addEventListener("click", () => { const id = viewingId; if (id) { viewingId = null; openDm(id); } });
$("#chatSearch").addEventListener("input", (e) => { chatQ = e.target.value; renderDmList(); });
$("#dmList").addEventListener("click", (e) => { const r = e.target.closest(".row"); if (r) openDm(r.dataset.peer); });
$("#dmList").addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const r = e.target.closest(".row");
  if (r) { e.preventDefault(); openDm(r.dataset.peer); }
});
$("#dmBack").addEventListener("click", closeDm);
$("#attBtn").addEventListener("click", () => $("#attIn").click());
$("#attIn").addEventListener("change", (e) => { pickFile("main", e.target.files[0]); e.target.value = ""; });
$("#dmAttBtn").addEventListener("click", () => $("#dmAttIn").click());
$("#dmAttIn").addEventListener("change", (e) => { pickFile("dm", e.target.files[0]); e.target.value = ""; });
$("#photoBtn").addEventListener("click", () => $("#photoIn").click());
$("#photoIn").addEventListener("change", (e) => { setPhoto(e.target.files[0]); e.target.value = ""; });
$("#viewer").addEventListener("click", closeViewer);
$("#dmForm").addEventListener("submit", (e) => { e.preventDefault(); sendDm(); });
$("#dmInput").addEventListener("input", dmAuto);
$("#dmInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !/Android|iPhone|iPad|Mobi/i.test(navigator.userAgent)) { e.preventDefault(); sendDm(); }
});
document.addEventListener("visibilitychange", () => { if (!document.hidden) markDmRead(); });
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", () => {
    const c = $("#dm");
    if (!dmOpenId) { c.style.height = ""; return; }
    c.style.height = window.visualViewport.height + "px";
    const el = $("#dmMsgs"); el.scrollTop = el.scrollHeight;
  });
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) { ping(); markRead(); } });
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", () => {
    const c = $("#chat");
    if (!chatOpen) { c.style.height = ""; return; }
    c.style.height = window.visualViewport.height + "px";
    const el = $("#msgs"); el.scrollTop = el.scrollHeight;
  });
}

function route() {
  if (!window.__splashDone || !authKnown) return;
  const target = user ? "app" : "auth";
  if (user) { fillProfile(); startRealtime(); } else { stopRealtime(); }
  if (!revealed) { revealed = true; window.Cohort.reveal(target); } else { window.Cohort.show(target); }
}

document.addEventListener("splash-done", route);

onAuthStateChanged(auth, async (u) => {
  authKnown = true; window.__authKnown = true;
  if (registering) return;
  user = u;
  if (u) { try { await ensureProfile(u); } catch (e) { profile = null; } }
  route();
});

if (INVITE_CODE) $("#inviteField").classList.remove("hidden");

$("#loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const m = $("#loginMsg"); msg(m, "");
  const email = $("#le").value.trim(), pw = $("#lp").value;
  if (!email || !pw) { msg(m, "Enter your email and password."); return; }
  const b = $("#loginForm .btn"); busy(b, true);
  try { await signInWithEmailAndPassword(auth, email, pw); $("#lp").value = ""; }
  catch (err) { msg(m, friendly(err)); }
  finally { busy(b, false); }
});

$("#registerForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const m = $("#regMsg"); msg(m, "");
  const name = $("#rn").value.trim(), email = $("#re").value.trim(), pw = $("#rp").value, pc = $("#rc").value;
  if (name.length < 2 || name.length > 60) { msg(m, "Enter your full name (2 to 60 characters)."); return; }
  if (!email) { msg(m, "Enter your email address."); return; }
  if (pw.length < 8) { msg(m, "Use at least 8 characters for your password."); return; }
  if (pw !== pc) { msg(m, "The two passwords don't match."); return; }
  if (INVITE_CODE && $("#ri").value.trim().toLowerCase() !== INVITE_CODE.toLowerCase()) { msg(m, "That invite code isn't right. Ask the person who invited you."); return; }
  const b = $("#registerForm .btn"); busy(b, true);
  registering = true;
  let created = null;
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pw);
    created = cred.user;
    await updateProfile(created, { displayName: name });
    await ensureProfile(created, name);
    sendEmailVerification(created).catch(() => {});
    user = created;
  } catch (err) { msg(m, friendly(err)); if (created) { try { await signOut(auth); } catch (e) {} } }
  finally { registering = false; busy(b, false); }
  if (user) { $("#rp").value = ""; $("#rc").value = ""; route(); }
});

$("#forgot").addEventListener("click", async () => {
  const m = $("#loginMsg"), email = $("#le").value.trim();
  if (!email) { msg(m, "Type your email above, then tap Forgot password."); return; }
  try { await sendPasswordResetEmail(auth, email); msg(m, "If an account exists for that email, a reset link is on its way.", true); }
  catch (err) { msg(m, friendly(err)); }
});

$("#saveName").addEventListener("click", async () => {
  const m = $("#profMsg"), name = $("#pn").value.trim(), b = $("#saveName");
  if (name.length < 2 || name.length > 60) { msg(m, "Name must be 2 to 60 characters."); return; }
  busy(b, true);
  try {
    await updateDoc(doc(db, "publicProfiles", user.uid), { name: name });
    await updateProfile(user, { displayName: name });
    profile = Object.assign({}, profile, { name: name });
    fillProfile(); msg(m, "Saved.", true);
  } catch (err) { msg(m, friendly(err)); }
  finally { busy(b, false); }
});

$("#logout").addEventListener("click", async () => {
  stopRealtime();
  try { await signOut(auth); } catch (e) {}
  user = null; profile = null;
  window.Cohort.authMode("login");
  window.Cohort.show("auth");
});
</script>
</body>
